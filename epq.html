scene("level 2", (args = {}) => {
var player = add([
  sprite('player'),
  scale(1.5),
  pos(20, 20),
  body()
])

var  speed = 120
var  normaljump = 350
var  jump = 350
var  jumphigher = 500
var  fallDeath = 600
var  mobSpeed = 15

keyDown('d', () => {
  player.move(speed,0)
})

keyDown('a', () => {
  player.move(-speed,0)
})

keyPress('space', () => {
  if(player.grounded())
  player.jump(jump)
})

addLevel([
  '          v v v                  ',
  '         ooooooooo               ',
  '                                 ',
  '                                 ',
  '                    o            ',
  '                                 ',
  '                        o        ',
  '                     o           ',
  '  ooooot                         ',
  '                          of     ',
  '                                 ',
], {
    width: 40,
    height: 40,
    'x': [sprite('grass'), solid()],
    'b': [sprite('butterfly'), 'butterfly', 'evil'],
    'f': [sprite('finish'), solid(), 'finish', scale(5)],
    'o': [sprite('brick'), solid(), scale(2), 'brick' ],
    'i': [sprite('invisible-block'), solid(), scale(10)], 
    't': [sprite('trampoline'), solid(), scale(2), 'jumphigh'],
    'v': [sprite('spike2'), solid(), scale(2), 'evil']
})

player.collides('evil' , () => {
  destroy(player)
  go('lose2')
})

player.action(() => {
    camPos(player.pos);
    if (player.pos.y >= fallDeath){
      go('lose2')
    } 
})

player.collides('jumphigh', () => {
  jump = 800 
})

player.collides('brick', () => {
  if (jump > 350)
  jump = 350 
})

player.collides('finish', () => {
  go('level 3')
})






});

scene("level1", (args = {}) => {

])

const mobSpeed = 15

})

  player.move(speed, 0)
})

keyDown('w', () => {
  player.move(0, speed)
})

keyPress('space', () => {
  if (player.grounded())
    player.jump(jump)
})
